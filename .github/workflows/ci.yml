name: Build & Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    AUTH_MODE: "none"
    APP_MODE: "ci"
    CI: true

permissions:
    contents: read

jobs:
    frontend-ci:
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@6b2f0bb53bac8ccb9847ba77f68f62488b668f6d # v10.0.3
        permissions:
            contents: read
            pull-requests: write
