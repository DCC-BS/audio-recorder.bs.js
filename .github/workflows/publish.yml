name: Publish Package
on:
    workflow_dispatch:

permissions:
    id-token: write # Required for OIDC
    contents: write

jobs:
    publish:
        uses: DCC-BS/ci-workflows/.github/workflows/npm-publish.yml@e4b0133a84dbb31d57dd2389f22fce8b85cf55b7 # v10.0.4
        with:
            install_command: bun install
            build_command: bun run generate
            prepack_command: bun run prepack
