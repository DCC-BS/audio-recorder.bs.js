name: Publish Package
on:
    workflow_dispatch:

permissions:
    id-token: write # Required for OIDC
    contents: write

jobs:
    publish:
        uses: DCC-BS/ci-workflows/.github/workflows/npm-publish.yml@a7a5611d4ea9bc55f27ca8bc22327181d0e0cbc0 # v10.0.0
        with:
            install_command: bun install
            build_command: bun run generate
            prepack_command: bun run prepack
