name: Publish Package
on:
    workflow_dispatch:

permissions:
    id-token: write # Required for OIDC
    contents: write

jobs:
    publish:
        uses: DCC-BS/ci-workflows/.github/workflows/npm-publish.yml@6b2f0bb53bac8ccb9847ba77f68f62488b668f6d # v10.0.3
        with:
            install_command: bun install
            build_command: bun run generate
            prepack_command: bun run prepack
