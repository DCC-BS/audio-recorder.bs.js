name: Publish Package
on:
    workflow_dispatch:

permissions:
    id-token: write # Required for OIDC
    contents: write

jobs:
    publish:
        uses: DCC-BS/ci-workflows/.github/workflows/npm-publish.yml@4594d0b9ddf95dcd54c25e599f927d5a23ae7950 # v10.0.6
        with:
            install_command: bun install
            build_command: bun run generate
            prepack_command: bun run prepack
