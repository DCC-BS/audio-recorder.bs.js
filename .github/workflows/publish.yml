name: Publish Package
on:
    workflow_dispatch:

permissions:
    id-token: write # Required for OIDC
    contents: write

jobs:
    publish:
        uses: DCC-BS/ci-workflows/.github/workflows/npm-publish.yml@8b031be53aee5210c6b392115bd941c80e798d60 # v10.0.1
        with:
            install_command: bun install
            build_command: bun run generate
            prepack_command: bun run prepack
